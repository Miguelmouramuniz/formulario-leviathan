
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expedição Leviathan</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>EXPEDIÇÃO LEVIATHAN</h1>
    <p>Formulário oficial da tripulação</p>
    <button type="button" id="openPanel">Painel administrativo</button>
  </header>

  <main>
    <form id="form">

      <label>Nickname do Roblox</label>
      <input type="text" name="nick" placeholder="Seu nickname" required>

      <label>Gênero</label>
      <select name="gender" required>
        <option value="">Selecione</option>
        <option value="Masculino">Masculino</option>
        <option value="Feminino">Feminino</option>
        <option value="Gay">Gay</option>
        <option value="Trans">Trans</option>
        <option value="Espaçonave">Espaçonave</option>
        <option value="Gay ao contrário">Gay ao contrário</option>
        <option value="Outro">Outro</option>
        <option value="Prefiro não responder">Prefiro não responder</option>
      </select>

      <label>Horário disponível</label>
      <input type="text" name="schedule" placeholder="Ex: 19h até 22h" required>

      <label>Lula ou Bolsonaro?</label>
      <select name="politics" required>
        <option value="">Selecione</option>
        <option value="Lula">Lula</option>
        <option value="Bolsonaro">Bolsonaro</option>
        <option value="Nenhum">Nenhum</option>
        <option value="Prefiro não responder">Prefiro não responder</option>
      </select>

      <label>Observações (opcional)</label>
      <textarea name="notes" placeholder="Alguma informação extra?"></textarea>

      <button type="submit" id="send">Enviar inscrição</button>

      <p id="message"></p>

    </form>
  </main>

  <!-- LOGIN -->
  <div id="modal" style="display:none;">
    <div class="modal-content">
      <h2>Painel administrativo</h2>

      <form id="loginForm">
        <input type="password" id="password" placeholder="Senha" required>
        <button type="submit">Entrar</button>
      </form>

      <p id="loginMessage"></p>
      <button type="button" id="close">Fechar</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <section id="dashboard" style="display:none;">
    <h2>Inscrições recebidas</h2>
    <h3>Total: <span id="count">0</span></h3>

    <div id="entries"></div>

    <button type="button" id="refresh">Atualizar</button>
    <button type="button" id="logout">Sair</button>
  </section>

  <!-- SUPABASE PRIMEIRO -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- NOSSO JAVASCRIPT DEPOIS -->
  <script src="script.js?v=3"></script>

</body>
</html>
